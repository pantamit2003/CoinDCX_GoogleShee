name: Historical Backtest

on:
  workflow_dispatch:
    # Ye line "Run workflow" button dikhati hai GitHub ke Actions tab pe.
    # Koi cron schedule nahi hai — kyunki backtest baar-baar automatic
    # chalne wala kaam nahi hai, jab chaho tab manually chalao.

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create credentials.json from secret
        run: |
          cat > credentials.json << 'EOF'
          ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          EOF

      - name: Create telegram_config.py from secrets
        run: |
          echo "TELEGRAM_BOT_TOKEN = \"${{ secrets.TELEGRAM_BOT_TOKEN }}\"" > telegram_config.py
          echo "TELEGRAM_CHAT_ID = \"${{ secrets.TELEGRAM_CHAT_ID }}\"" >> telegram_config.py

      - name: Run backtest_historical.py
        run: python backtest_historical.py

      - name: Upload CSV as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results-csv
          path: backtest_results.csv

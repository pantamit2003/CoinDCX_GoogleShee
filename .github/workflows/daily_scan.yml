name: Daily CoinDCX Scan

on:
  schedule:
    - cron: '15 0 * * *'   # UTC 00:15 = IST 5:45 AM
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create credentials.json from secret
        run: |
          cat > credentials.json << 'EOF'
          ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          EOF

      - name: Create telegram_config.py from secrets
        run: |
          echo "TELEGRAM_BOT_TOKEN = \"${{ secrets.TELEGRAM_BOT_TOKEN }}\"" > telegram_config.py
          echo "TELEGRAM_CHAT_ID = \"${{ secrets.TELEGRAM_CHAT_ID }}\"" >> telegram_config.py

      - name: Run check_watchlist.py
        run: python check_watchlist.py

      - name: Run daily_breakout_scan.py
        run: python daily_breakout_scan.py

      - name: Run volume_watch.py
        run: python volume_watch.py

      - name: Save updated volume watchlist back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add volume_watchlist.json
          git commit -m "Update volume watchlist" || echo "No changes to commit"
          git push

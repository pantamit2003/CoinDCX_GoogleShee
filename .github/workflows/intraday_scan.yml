name: Intraday Volume Spike Monitor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create credentials.json from secret
        run: |
          cat > credentials.json << 'EOF'
          ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          EOF

      - name: Create telegram_config.py from secrets
        run: |
          echo "TELEGRAM_BOT_TOKEN = \"${{ secrets.TELEGRAM_BOT_TOKEN }}\"" > telegram_config.py
          echo "TELEGRAM_CHAT_ID = \"${{ secrets.TELEGRAM_CHAT_ID }}\"" >> telegram_config.py
          echo "TELEGRAM_STRONG_BOT_TOKEN = \"${{ secrets.TELEGRAM_STRONG_BOT_TOKEN }}\"" >> telegram_config.py
          echo "TELEGRAM_STRONG_CHAT_ID = \"${{ secrets.TELEGRAM_STRONG_CHAT_ID }}\"" >> telegram_config.py
          echo "CONFUSION_BOT_TOKEN = \"${{ secrets.CONFUSION_BOT_TOKEN }}\"" >> telegram_config.py
          echo "CONFUSION_CHAT_ID = \"${{ secrets.CONFUSION_CHAT_ID }}\"" >> telegram_config.py

      - name: Run intraday_spike_monitor.py
        run: python intraday_spike_monitor.py

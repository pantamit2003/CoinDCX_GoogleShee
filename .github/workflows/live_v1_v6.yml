name: Live V1-V6 Alert Scan

on:
  workflow_dispatch:

  schedule:
    - cron: "0,15,30,45 * * * *"

permissions:
  contents: read

jobs:
  run-live-v1-v6-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create credentials.json
        run: |
          cat > credentials.json << 'EOF'
          ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          EOF

      - name: Create telegram_config.py
        run: |
          cat > telegram_config.py << 'EOF'
          TELEGRAM_BOT_TOKEN = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          TELEGRAM_CHAT_ID = "${{ secrets.TELEGRAM_CHAT_ID }}"

          TELEGRAM_STRONG_BOT_TOKEN = "${{ secrets.TELEGRAM_STRONG_BOT_TOKEN }}"
          TELEGRAM_STRONG_CHAT_ID = "${{ secrets.TELEGRAM_STRONG_CHAT_ID }}"

          CONFUSION_BOT_TOKEN = "${{ secrets.CONFUSION_BOT_TOKEN }}"
          CONFUSION_CHAT_ID = "${{ secrets.CONFUSION_CHAT_ID }}"

          LIVE_V5_BOT_TOKEN = "${{ secrets.LIVE_V5_BOT_TOKEN }}"
          LIVE_V5_CHAT_ID = "${{ secrets.LIVE_V5_CHAT_ID }}"

          V1_V3_BOT_TOKEN = "${{ secrets.V1_V3_BOT_TOKEN }}"
          V1_V3_CHAT_ID = "${{ secrets.V1_V3_CHAT_ID }}"

          V4_V6_BOT_TOKEN = "${{ secrets.V4_V6_BOT_TOKEN }}"
          V4_V6_CHAT_ID = "${{ secrets.V4_V6_CHAT_ID }}"
          EOF

      - name: Check Telegram Config
        run: |
          python - <<'PY'
          import telegram_config

          required = [
              "TELEGRAM_BOT_TOKEN",
              "TELEGRAM_CHAT_ID",
              "TELEGRAM_STRONG_BOT_TOKEN",
              "TELEGRAM_STRONG_CHAT_ID",
              "CONFUSION_BOT_TOKEN",
              "CONFUSION_CHAT_ID",
              "LIVE_V5_BOT_TOKEN",
              "LIVE_V5_CHAT_ID",
              "V1_V3_BOT_TOKEN",
              "V1_V3_CHAT_ID",
              "V4_V6_BOT_TOKEN",
              "V4_V6_CHAT_ID",
          ]

          print("Checking Telegram configuration...")

          for name in required:
              value = getattr(telegram_config, name, None)

              if value:
                  print(f"{name}: OK")
              else:
                  print(f"{name}: MISSING")
                  raise SystemExit(
                      f"Missing required Telegram config: {name}"
                  )

          print("All Telegram configuration variables are available.")
          PY

      - name: Run Live V1-V6 Scanner
        env:
          DRY_RUN: "False"

          V1_V3_BOT_TOKEN: ${{ secrets.V1_V3_BOT_TOKEN }}
          V1_V3_CHAT_ID: ${{ secrets.V1_V3_CHAT_ID }}

          V4_V6_BOT_TOKEN: ${{ secrets.V4_V6_BOT_TOKEN }}
          V4_V6_CHAT_ID: ${{ secrets.V4_V6_CHAT_ID }}

        run: |
          python live_v1_v6_scanner.py

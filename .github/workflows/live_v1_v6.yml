name: Live V1-V6 Alert Scan

on:
  workflow_dispatch:

  schedule:
    - cron: "0,15,30,45 * * * *"

permissions:
  contents: read

jobs:
  run-live-v1-v6-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create credentials.json
        run: |
          cat > credentials.json << 'EOF'
          ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          EOF

      - name: Run Live V1-V6 Scanner
        env:
          DRY_RUN: "False"

          V1_V3_BOT_TOKEN: ${{ secrets.V1_V3_BOT_TOKEN }}
          V1_V3_CHAT_ID: ${{ secrets.V1_V3_CHAT_ID }}

          V4_V6_BOT_TOKEN: ${{ secrets.V4_V6_BOT_TOKEN }}
          V4_V6_CHAT_ID: ${{ secrets.V4_V6_CHAT_ID }}

        run: |
          python live_v1_v6_scanner.py
